<section class="container mx-auto">
  <h2 class="text-3xl font-bold">Houses</h2>
  <h3 class="text-xl text-gray-500 mb-4">{{ houses().length }} Houses available</h3>
</section>

<section
  class="container mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2"
>
  @for (house of houses(); track house.id; let i = $index) {
    <div class="card bg-base-100 shadow-sm">
      <app-mini-map [coordinates]="house.lngLat" [zoom]="14" />

      <div class="card-body">
        <h2 class="card-title">
          {{ house.name }}
          @if (i === 1) {
            <div class="badge badge-secondary">NEW</div>
          }
        </h2>
        <p>
          {{ house.description }}
        </p>
        <div class="card-actions justify-end">
          @for (label of house.tags; track label) {
            <div class="badge badge-primary">{{ label }}</div>
          }
        </div>
      </div>
    </div>
  }
</section>
