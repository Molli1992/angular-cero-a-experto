<div #map class="w-full h-[60vh] md:h-[calc(100vh-100px)]"></div>

<section
  class="md:fixed w-full md:w-65 max-h-[calc(40vh-115px)] md:max-h-[calc(100vh-120px)] mt-4 md:mt-0 bg-white rounded top-22 left-6 p-2 overflow-y-auto z-999"
>
  <h2 class="text-xl font-bold text-black mb-2">Markers</h2>

  <div class="flex flex-col gap-2">
    @for (marker of markers(); track marker.id) {
      <div class="flex flex-col gap-2 py-2">
        <div class="flex items-center">
          <button
            class="cursor-pointer text-gray-600 hover:text-black bg-inherit mr-2"
            (click)="deleteMarker(marker)"
          >
            X
          </button>
          <label
            class="label cursor-pointer"
            (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
          >
            <span class="label-text text-black text-xs min-w-0 break-all whitespace-normal">{{
              marker.mapboxMarker.getLngLat() | json
            }}</span>
            <input
              type="radio"
              name="radio-10"
              class="radio"
              [style]="{ backgroundColor: marker.mapboxMarker._color }"
              checked="checked"
            />
          </label>
        </div>
        <hr />
      </div>
    } @empty {
      <div class="flex justify-center items-center bg-blue-100 rounded py-3">
        <p class="text-xs text-secondary">No markers yet.</p>
      </div>
    }
  </div>
</section>
