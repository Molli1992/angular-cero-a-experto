<button
  type="button"
  title="Share gif"
  class="group relative block w-full cursor-pointer rounded-lg overflow-hidden"
  (click)="onShare()"
>
  <img
    class="w-full h-auto rounded-lg"
    [src]="imageUrl()"
    [alt]="gifTitle()"
    [attr.width]="width()"
    [attr.height]="height()"
  />

  <span
    class="absolute top-2 right-2 flex items-center justify-center w-9 h-9 rounded-full bg-black/60 text-white opacity-0 group-hover:opacity-100 transition ease-linear duration-150"
  >
    <i class="fa-solid fa-share-nodes"></i>
  </span>

  @if (linkCopied()) {
    <span
      class="absolute bottom-2 left-1/2 -translate-x-1/2 px-3 py-1 rounded-md bg-black/70 text-white text-sm"
    >
      Link copied
    </span>
  }
</button>
