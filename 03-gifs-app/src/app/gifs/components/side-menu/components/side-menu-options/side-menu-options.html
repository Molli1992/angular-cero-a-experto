<div id="nav" class="w-full">
  @for (item of menuOptions; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-blue-800"
      class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
    >
      <div>
        <i class="{{ item.icon }}"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-bold leading-5 text-white">{{ item.label }}</span>
        <span class="text-sm text-white/50">{{ item.subLabel }}</span>
      </div>
    </a>
  }

  @for (key of gifsService.searchHistoryKeys(); track key) {
    <a
      [routerLink]="['/dashboard/history', key]"
      routerLinkActive="bg-blue-800"
      class="w-full px-2 inline-flex space-x-2 items-center py-3 hover:bg-white/5 transition ease-linear duration-150"
    >
      <div>
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-bold leading-5 text-white">{{ key }}</span>
      </div>
      <button
        type="button"
        title="Delete from history"
        class="ml-auto px-2 text-white/50 hover:text-red-500 cursor-pointer transition ease-linear duration-150"
        (click)="onRemoveHistory($event, key)"
      >
        <i class="fa-solid fa-trash"></i>
      </button>
    </a>
  }

  <div class="w-full h-px bg-slate-700"></div>
</div>
