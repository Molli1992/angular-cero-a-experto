<h2>Nested selectors</h2>
<hr />

<form [formGroup]="myForm">
  <!-- Region -->
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Continent:</label>
      <select formControlName="region" class="form-control">
        <option value="">-- Select Continent --</option>

        @for (region of regions(); track region) {
          <option [value]="region">
            {{ region }}
          </option>
        }
      </select>
    </div>
  </div>

  <!-- Countries -->

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Country:</label>
      <select formControlName="country" class="form-control">
        <option value="">-- Select Country --</option>
        @for (country of countriesByRegion(); track country.codes.alpha_3) {
          <option [value]="country.codes.alpha_3">
            {{ country.names.common }}
          </option>
        }
      </select>
    </div>
  </div>

  <!-- Country Borders -->

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Borders:</label>
      <select formControlName="border" class="form-control">
        <option value="">-- Select Border --</option>
        @for (country of borders(); track country.codes.alpha_3) {
          <option [value]="country.codes.alpha_3">
            {{ country.names.common }}
          </option>
        }
      </select>
    </div>
  </div>
</form>

<div>
  <h3>Form:</h3>
  <p>Is form valid: {{ myForm.valid }}</p>
  <p>Value: {{ myForm.value | json }}</p>
</div>
