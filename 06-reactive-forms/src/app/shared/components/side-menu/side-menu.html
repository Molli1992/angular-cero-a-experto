<div style="width: 100px; height: 100%">
  <h2>Pages</h2>
  <hr />

  <h4 class="mt-3">Reactive</h4>
  <ul class="list-group">
    @for (item of reactiveMenu; track item.title) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="list-group-item list-group-item-action"
      >
        {{ item.title }}
      </a>
    }
  </ul>

  <h4 class="mt-3">Auth</h4>
  <ul class="list-group">
    @for (item of authMenu; track item.title) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="list-group-item list-group-item-action"
      >
        {{ item.title }}
      </a>
    }
  </ul>

  <h4 class="mt-3">Countries</h4>
  <ul class="list-group">
    @for (item of countryMenu; track item.title) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="list-group-item list-group-item-action"
      >
        {{ item.title }}
      </a>
    }
  </ul>
</div>
