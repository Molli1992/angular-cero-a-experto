<h1>DragonBall Page</h1>
<hr />

<section class="row">
  <div class="col-12 col-sm-6">
    <h3 class="text-decoration-underline">Character:</h3>
    <h3>
      Name: <span class="text-danger">{{ name() }}</span>
    </h3>
    <h3>
      Power: <span class="text-danger">{{ power() }}</span>
    </h3>
    <input
      type="text"
      class="fomr-control"
      placeholder="Name"
      [value]="name()"
      (input)="name.set($event.target.value)"
    />
    <input
      type="number"
      class="fomr-control mt-2"
      placeholder="Power"
      [value]="power()"
      (input)="power.set($event.target.valueAsNumber)"
    />

    <div class="mt-2">
      <button class="btn btn-primary" (click)="addCharacter()">Add</button>
    </div>
  </div>

  <div class="col-12 col-sm-6">
    <h3>Characters list:</h3>
    <ul>
      @for (character of characters(); track character.id) {
        @if (character.power >= 1000) {
          <li>
            <span>{{ character.name }}</span>
            <strong
              [class.text-danger]="character.power > 9000"
              [class.text-success]="character.power < 9000"
              [class.text-info]="character.power < 6000"
              [class.text-warning]="character.power < 3000"
            >
              <!--[ngClass]="powerClasses()"-->
              ({{ character.power }})
            </strong>
          </li>
        }
      }
    </ul>
  </div>
</section>
