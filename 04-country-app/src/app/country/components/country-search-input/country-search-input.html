<section class="flex gap-2">
  <input
    type="text"
    class="input input-bordered w-56"
    [placeholder]="placeholder()"
    autofocus
    #txtSearch
    (keyup.enter)="value.emit(txtSearch.value)"
  />

  <button class="btn btn-primary" (click)="value.emit(txtSearch.value)">Search</button>
</section>
