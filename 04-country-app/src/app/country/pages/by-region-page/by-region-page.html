<country-page-container>
  <h1 class="text-2xl">By region:</h1>
  <h3 class="text-lg">Select a region</h3>

  <section class="row">
    <div class="flex-col">
      @for (region of regions; track region) {
        <button
          class="btn btn-outline mr-2 mb-2 w-24"
          [class.btn-primary]="selectedRegion() === region"
          (click)="this.selectedRegion.set(region)"
        >
          {{ region }}
        </button>
      }
    </div>
  </section>

  <country-list
    [countries]="countryResource.value() ?? []"
    [isLoading]="countryResource.isLoading()"
    [isEmpty]="countryResource.value()?.length === 0"
    [errorMessage]="countryResource.error()"
  />
</country-page-container>
